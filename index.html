<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Patient Registration App</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Register Patient</h1>

  <!-- 🔴 Error Message Box -->
  <!-- <div id="form-errors" style="color: red; margin-bottom: 1em;"></div> -->
  <div id="form-errors" style="display: none; color: red; margin-bottom: 1em;"></div>
  


  <form id="patient-form">
    <input type="text" name="name" placeholder="Name" required />
    <input type="number" name="age" placeholder="Age" required />
    <input type="text" name="gender" placeholder="Gender" required />
    <input type="text" name="contact" placeholder="Contact Info" required />
    <input type="date" name="dob" placeholder="Date of Birth" required />

    <label>Any Health History?</label><br/>
    <label><input type="radio" name="history" value="Yes" required /> Yes</label>
    <label><input type="radio" name="history" value="No" required /> No</label><br/>

    <textarea name="historyDetails" placeholder="Health history details (if any)" style="display: none;"></textarea>

    <select name="bloodGroup">
      <option value="">Select Blood Group (Optional)</option>
      <option value="A+">A+</option>
      <option value="A-">A-</option>
      <option value="B+">B+</option>
      <option value="B-">B-</option>
      <option value="AB+">AB+</option>
      <option value="AB-">AB-</option>
      <option value="O+">O+</option>
      <option value="O-">O-</option>
    </select>

    <textarea name="address" placeholder="Address" required></textarea>
    <button type="submit">Register</button>
  </form>

  <h2>Run SQL Query</h2>
  <textarea id="query-input" rows="5" cols="50">SELECT * FROM patients;</textarea>
  <button id="run-query">Run Query</button>

  <h2>Patient Records</h2>
  <table id="result-table" border="1">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Age</th>
        <th>Gender</th>
        <th>Contact</th>
        <th>DOB</th>
        <th>Health History</th>
        <th>Health Details</th>
        <th>Blood Group</th>
        <th>Address</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <pre id="query-result"></pre>

  <script type="module" src="main.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const radios = document.querySelectorAll('input[name="history"]');
      const detailBox = document.querySelector('textarea[name="historyDetails"]');
      radios.forEach(radio => {
        radio.addEventListener('change', () => {
          detailBox.style.display = radio.value === 'Yes' ? 'block' : 'none';
        });
      });
    });
  </script>
</body>
</html>
